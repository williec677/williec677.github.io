# Builds the Jekyll site and deploys it to GitHub Pages.
# Runs on every push, on demand, and once a day at 14:05 UTC (9:05 AM Eastern Standard Time,
# 10:05 AM during daylight time) so posts dated in the future go live on their publish date.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 1200000
  # Tells IndexNow (Bing, Yandex, Seznam, Naver; Google does not use it) about new or changed URLs.
  # Runs only after a successful deploy and can never fail the workflow.
  #   push:              posts added or changed in the pushed commits (only if they are live in the sitemap)
  #   schedule (daily):  posts whose sitemap lastmod is today, so scheduled posts are announced on their publish day
  #   workflow_dispatch: every URL in the sitemap
  # The key file lives at the repo root as <key>.txt. If you change the key, rename that file to match.
  indexnow:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ping IndexNow
        env:
          INDEXNOW_KEY: 5908965c96dc3e71d77eefc66b4d9099
          SITE_HOST: mrtictoctalk.com
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY' || echo "IndexNow step failed; ignoring"
          import datetime, json, os, re, subprocess, sys, time, urllib.request
          key, host = os.environ["INDEXNOW_KEY"], os.environ["SITE_HOST"]
          event = os.environ.get("GITHUB_EVENT_NAME", "")
          time.sleep(60)  # give the Pages CDN a moment to serve the new build
          xml = None
          for base in (f"https://{host}", f"http://{host}"):
              try:
                  xml = urllib.request.urlopen(f"{base}/sitemap.xml?ts={int(time.time())}", timeout=30).read().decode()
                  break
              except Exception as e:
                  print(f"Could not read {base}/sitemap.xml: {e}")
          if not xml:
              sys.exit(0)
          entries = re.findall(r"<loc>([^<]+)</loc>(?:\s*<lastmod>([^<]+)</lastmod>)?", xml)
          live = {u for u, _ in entries}
          print(f"{len(live)} URLs in the live sitemap")
          if event == "workflow_dispatch":
              urls = sorted(live)
          elif event == "push":
              before, after = os.environ.get("BEFORE_SHA", ""), os.environ["AFTER_SHA"]
              rng = [after + "~1", after] if not before or set(before) == {"0"} else [before, after]
              changed = set(subprocess.run(["git", "diff", "--name-only", "--diff-filter=AM", *rng],
                                           capture_output=True, text=True).stdout.split())
              print("Changed files:", sorted(changed))
              urls = []
              for path in sorted(changed):
                  m = re.match(r"_posts/\d{4}-\d{2}-\d{2}-(.+)\.(md|markdown|html)$", path)
                  if m:
                      u = f"https://{host}/{m.group(1)}/"
                      if u in live:
                          urls.append(u)
          else:
              today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-5))).date().isoformat()
              urls = [u for u, mod in entries if mod and mod.startswith(today)]
          if not urls:
              print("No URLs to submit.")
              sys.exit(0)
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("IndexNow response:", r.status, urls)
          except Exception as e:
              print("IndexNow request failed (ignored):", e, urls)
          PY
