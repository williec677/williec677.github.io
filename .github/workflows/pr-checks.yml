# Pull request checks for website development. Runs ONLY on pull requests.
# It never deploys, never touches GitHub Pages, and does not change pages.yml, its daily cron or IndexNow.
# Builds the base branch and the PR with the same builder as production, then compares them.
name: PR checks

on:
  pull_request:
    branches: [main, web/redesign]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the PR (merge result)
        uses: actions/checkout@v7
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - name: Build base
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./base
          destination: ./base_site
      - name: Build PR
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pr
          destination: ./pr_site
      - name: Compare and check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          sudo chown -R "$(id -u)" base_site pr_site
          python3 - <<'PY'
          import os, re, subprocess, sys
          labels = set(filter(None, os.environ.get("LABELS", "").split(",")))
          fails, warns = [], []

          # 1. Protected paths: editorial content, social media, verification files, deploy workflow, domain.
          diff = subprocess.run(["git", "-C", "pr", "diff", "--name-status", "-M",
                                 os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]],
                                capture_output=True, text=True, check=True).stdout.splitlines()
          editorial = re.compile(r"^(_posts/|release-log\.md$|content-calendar\.md$)")
          infra = re.compile(r"^(assets/social/|CNAME$|\.github/workflows/pages\.yml$|[0-9a-f]{32}\.txt$|google[0-9a-f]+\.html$)")
          for line in diff:
              parts = line.split("\t"); status = parts[0]; paths = parts[1:]
              for p in paths:
                  if editorial.search(p) and not status.startswith("A") and "editorial-approved" not in labels:
                      fails.append(f"Editorial file changed ({status} {p}). Articles may not be edited, renamed or deleted without the editorial-approved label from HYAN.")
                  if infra.search(p) and "infra-approved" not in labels:
                      fails.append(f"Protected infrastructure file changed ({status} {p}). Needs the infra-approved label.")

          # 2. Production settings that keep scheduling and URLs working.
          def cfg(path):
              return open(path, encoding="utf-8").read()
          for key in ["url", "permalink", "future", "timezone", "baseurl"]:
              rx = re.compile(rf"^{key}:\s*(.*)$", re.M)
              a, b = rx.search(cfg("base/_config.yml")), rx.search(cfg("pr/_config.yml"))
              if (a and a.group(1)) != (b and b.group(1)) and "infra-approved" not in labels:
                  fails.append(f"_config.yml '{key}' changed. Needs the infra-approved label.")

          # 3. Every URL that exists today must still exist (articles, tools, media, feeds).
          def files(root):
              out = {}
              for r, _, fs in os.walk(root):
                  for f in fs:
                      p = os.path.join(r, f)
                      out[os.path.relpath(p, root)] = os.path.getsize(p)
              return out
          base, pr = files("base_site"), files("pr_site")
          gone = sorted(set(base) - set(pr))
          if gone:
              fails.append(f"{len(gone)} published URLs would disappear, for example: {gone[:10]}. Add redirects instead of removing URLs.")

          # 4. Internal links: no NEW broken internal links.
          def broken(root):
              bad = set()
              rx = re.compile(r'(?:href|src)="(?:https://mrtictoctalk\.com)?(/[^"#?]*)')
              for rel in [k for k in (base if root == "base_site" else pr) if k.endswith(".html")]:
                  t = open(os.path.join(root, rel), encoding="utf-8", errors="replace").read()
                  for u in rx.findall(t):
                      if u.startswith("//"):
                          continue
                      p = u.lstrip("/")
                      cands = [p, p.rstrip("/") + "/index.html", p.rstrip("/") + ".html"] if p else ["index.html"]
                      if not any(os.path.exists(os.path.join(root, c)) for c in cands):
                          bad.add((rel, u))
              return bad
          bb, pb = broken("base_site"), broken("pr_site")
          new_bad = sorted(pb - bb)
          print(f"Internal broken links: base {len(bb)}, PR {len(pb)}, new {len(new_bad)}")
          if new_bad:
              fails.append(f"{len(new_bad)} new broken internal links, for example: {new_bad[:10]}")

          # 5. Size: GitHub Pages publishes at most 1 GB. Production is already near or over it.
          bs, ps = sum(base.values()), sum(pr.values())
          print(f"Site size: base {bs/1e6:.1f} MB, PR {ps/1e6:.1f} MB")
          if ps - bs > 50e6:
              fails.append(f"PR adds {(ps-bs)/1e6:.1f} MB to the published site (limit 50 MB per PR).")
          big = [k for k, v in pr.items() if v > 25 * 1024 * 1024 and k not in base]
          if big:
              fails.append(f"New files over 25 MiB: {big}")
          if ps > 1e9:
              warns.append("Published site is over 1 GB (GitHub Pages limit). See the storage proposal.")

          # 6. Production must never ship the preview's noindex.
          for k in pr:
              if k.endswith(".html") and k in base:
                  t = open(os.path.join("pr_site", k), encoding="utf-8", errors="replace").read()
                  if 'content="noindex, nofollow"' in t and 'content="noindex, nofollow"' not in open(os.path.join("base_site", k), encoding="utf-8", errors="replace").read():
                      fails.append(f"Page {k} gained noindex, nofollow. The preview overlay must not reach production.")
                      break

          for w in warns: print("WARNING:", w)
          for f in fails: print("FAIL:", f)
          if fails:
              sys.exit(1)
          print("All PR checks passed.")
          PY
